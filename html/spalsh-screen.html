<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Dilini Silva">
    <meta name="description" content="I'm Dilini Silva.A passionate web developer dedicated to crafting seamless,user-friendly web experiences. With a deep love for technology and an eye for design,
    I specialize in building modern, responsive websites that bring ideas to life.">
    <title>Dilini Silva</title>
    <link rel="icon" type="image/ico" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../style-new.css">
    <link rel="stylesheet" href="../assets/lib/normalize.css">
    <link rel="stylesheet" href="../assets/lib/fontawesome-free-6.7.2-web/css/all.min.css">
    <style>
        body {
            background-color:#1A1A1D;
            color: #FF885B;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            text-align: center;
        }

        input[type="range"] {
            width: 300px;
            margin: 20px 0;
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        output {
            font-weight: bold;
        }
    </style>
</head>
<body>

<form oninput="result.value=parseInt(dilini.value)">
    <p>Dilini Silva</p>
    <input type="range" min="0" max="100" id="dilini" name="dilini" value="0" disabled />
    <br />
    <span>
      <output name="result">0</output><span>%</span>
    </span>
</form>

<script>
    const range = document.getElementById("dilini");
    const output = document.querySelector("output");
    let value = 0;

    const interval = setInterval(() => {
        if (value >= 100) {
            clearInterval(interval);
            setTimeout(() => {
                window.location.href = "../index.html";
            });
            return;
        }
        value++;
        range.value = value;
        output.value = value;
    }, 10);
</script>

</body>
</html>
