<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Dilini Silva">
    <meta name="description" content="I'm Dilini Silva.A passionate web developer dedicated to crafting seamless,user-friendly web experiences. With a deep love for technology and an eye for design,
    I specialize in building modern, responsive websites that bring ideas to life.">
    <title>Dilini Silva</title>
    <link rel="icon" type="image/ico" href="assets/favicon.ico">
    <link rel="stylesheet" href="style-new.css">
    <link rel="stylesheet" href="assets/lib/normalize.css">
    <link rel="stylesheet" href="assets/lib/fontawesome-free-6.7.2-web/css/all.min.css">
</head>
<style>
    #splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1A1A1D;
        color: #FF885B;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
    }

    #splash input[type="range"] {
        width: 300px;
        margin: 20px 0;
        -webkit-appearance: none;
        height: 8px;
        border-radius: 5px;
        outline: none;
        cursor: pointer;
        box-shadow: inset 0 0 5px #FF885B;
        transition: background 0.3s ease;
        border: 1px solid #FF885B;
    }

    #splash input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        background: #FF885B;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 8px #FF885B;
        transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    #splash p {
        font-size: 1.5rem;
        margin-bottom: 10px;
        text-align: center;
    }

    #splash output {
        font-weight: bold;

    }
    .splash-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #percent-label {
        font-size: 1.5rem;
        font-weight: bold;
        margin-top: 10px;
        text-align: center;
    }

    #home{
        display: none;
    }


</style>
<body>

<div id="splash">
    <div class="splash-wrapper">
        <p>Dilini Silva</p>
        <input type="range" min="0" max="100" id="dilini" name="dilini" value="0" disabled />
        <div id="percent-label"><output name="result">0</output>%</div>
    </div>
</div>


<section class="home" id="home">
    <div class="container">
        <div class="text-content">
            <h1>Turning ideas into impactful web experiences!</h1>
            <p>A Passionate <span class="highlight"></span></p>
            <a href="html/about.html">
                <button>Explore</button>
            </a>
        </div>
        <div class="image-content">
            <img src="assets/me.png" alt="Profile Picture" class="profile-pic">
        </div>
    </div>
</section>

<script src="lib/jquery-3.7.1.min.js"></script>
<script src="portfolio.js"></script>

<script>
    const splash = document.getElementById("splash");
    const mainContent = document.getElementById("home");
    const range = document.getElementById("dilini");
    const output = document.querySelector("output");

    let value = 0;

    const interval = setInterval(() => {
        if (value >= 100) {
            clearInterval(interval);
            setTimeout(() => {
                splash.style.opacity = 0;
                setTimeout(() => {
                    splash.style.display = "none";
                    mainContent.style.display = "block";
                }, 500);
            }, 200);
            return;
        }
        value++;
        range.value = value;
        output.value = value;
    }, 10);
</script>

</body>
</html>
